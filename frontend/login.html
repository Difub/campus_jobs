<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h2>Вход</h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" id="loginEmail" required>
                    </div>
                    <div class="mb-3">
                        <label>Пароль</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>
                <div id="loginMessage" class="mt-2"></div>
                <hr>
                <p>Или <a href="#" id="registerLink">зарегистрироваться</a></p>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = 'http://localhost:8000';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.access_token);
                document.getElementById('loginMessage').innerHTML = '<span class="text-success">Успех! Токен сохранён.</span>';
            } else {
                document.getElementById('loginMessage').innerHTML = `<span class="text-danger">${data.detail}</span>`;
            }
        });
        // Быстрая регистрация
        document.getElementById('registerLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt('Email');
            const password = prompt('Пароль');
            const role = confirm('Вы работодатель? (OK – employer, Отмена – student)') ? 'employer' : 'student';
            const res = await fetch(`${API_BASE}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, role })
            });
            if (res.ok) alert('Регистрация успешна');
            else alert('Ошибка регистрации');
        });
    </script>
</body>
</html>
