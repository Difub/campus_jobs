<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет работодателя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">КампусРабота</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/static/login.html">Вход</a></li>
                    <li class="nav-item"><a class="nav-link" href="/static/dashboard.html">Мои заявки</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/static/employer.html">Работодателям</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="employerContent" class="d-none">
            <h1>Управление вакансиями</h1>

            <!-- Кнопка для создания новой вакансии -->
            <button class="btn btn-success mb-3" id="newVacancyBtn">Создать новую вакансию</button>

            <!-- Форма создания (скрыта изначально) -->
            <div class="card mb-4 d-none" id="vacancyFormCard">
                <div class="card-body">
                    <h5 class="card-title">Новая вакансия</h5>
                    <form id="newVacancyForm">
                        <div class="mb-3">
                            <label class="form-label">Название</label>
                            <input type="text" class="form-control" id="vTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea class="form-control" id="vDesc" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Тип</label>
                                <select class="form-select" id="vType" required>
                                    <option value="internship">Стажировка</option>
                                    <option value="part-time">Подработка</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Дедлайн</label>
                                <input type="date" class="form-control" id="vDeadline">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Опубликовать</button>
                        <button type="button" class="btn btn-secondary" id="cancelFormBtn">Отмена</button>
                    </form>
                    <div id="vacancyMessage" class="mt-2"></div>
                </div>
            </div>

            <!-- Список вакансий работодателя -->
            <h2>Мои вакансии</h2>
            <div id="myVacancyList" class="row g-3"></div>
        </div>

        <div id="authWarning" class="alert alert-warning">
            Пожалуйста, <a href="/static/login.html">войдите</a> как работодатель, чтобы управлять вакансиями.
        </div>
    </div>

    <!-- Модальное окно для просмотра заявок -->
    <div class="modal fade" id="applicationsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Заявки на вакансию <span id="applVacancyTitle"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="applicationsBody">
                    <!-- Заполняется динамически -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
    <script>
        // После загрузки DOM
        document.addEventListener('DOMContentLoaded', () => {
            checkEmployerAuth();
        });
    </script>
</body>
</html>
